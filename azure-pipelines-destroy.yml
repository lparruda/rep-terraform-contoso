trigger: none

parameters:
  - name: confirmDestroy
    displayName: 'Confirmar destruição total da infraestrutura?'
    type: boolean
    default: false

variables:
  azureServiceConnection: 'sc-azure-subscription'
  backendResourceGroup: 'rg-terraform-br'
  backendStorageAccount: 'sttfstatev2pereira8950'
  backendContainer: 'tfstate'
  terraformVersion: '1.9.5'

stages:
  - stage: DestroyVM
    displayName: '1. Teardown Linux VM'
    condition: eq('${{ parameters.confirmDestroy }}', true)
    jobs:
      - job: DestroyVMJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - bash: |
              curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
              rm -f /tmp/terraform.zip
              terraform -version
            displayName: 'Instalar Terraform CLI'

          - task: AzureCLI@2
            displayName: 'Destroy VM'
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(System.DefaultWorkingDirectory)/ambiente/prd/vm_linux'
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="ac1c748c-cf7e-4d1e-82a0-d52c7062c9b2"

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=contoso-vm.tfstate"
                terraform destroy -auto-approve

  - stage: DestroyNetwork
    displayName: '2. Teardown Virtual Network'
    dependsOn: DestroyVM
    condition: and(succeeded(), eq('${{ parameters.confirmDestroy }}', true))
    jobs:
      - job: DestroyNetJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - bash: |
              curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
              rm -f /tmp/terraform.zip
              terraform -version
            displayName: 'Instalar Terraform CLI'

          - task: AzureCLI@2
            displayName: 'Destroy Network'
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(System.DefaultWorkingDirectory)/network_prd'
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="ac1c748c-cf7e-4d1e-82a0-d52c7062c9b2"

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=contoso-vnet.tfstate"
                terraform destroy -auto-approve

  - stage: DestroyResourceGroup
    displayName: '3. Teardown Resource Group'
    dependsOn: DestroyNetwork
    condition: and(succeeded(), eq('${{ parameters.confirmDestroy }}', true))
    jobs:
      - job: DestroyRGJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - bash: |
              curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
              rm -f /tmp/terraform.zip
              terraform -version
            displayName: 'Instalar Terraform CLI'

          - task: AzureCLI@2
            displayName: 'Destroy Resource Group'
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(System.DefaultWorkingDirectory)/resource_groups'
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="ac1c748c-cf7e-4d1e-82a0-d52c7062c9b2"

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=contoso-rg.tfstate"
                terraform destroy -auto-approve

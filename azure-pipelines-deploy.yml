trigger: none
#  branches:
#    include:
#      - main
#      - teste

parameters:
  - name: environment
    displayName: 'Selecione o Ambiente:'
    type: string
    default: dev
    values:
      - dev
      - prd

  - name: deployBase
    displayName: '1. Provisionar Base (Resource Group e VNet)?'
    type: boolean
    default: true

  - name: deployLinux
    displayName: '2. Provisionar VMs Linux?'
    type: boolean
    default: true

  - name: deployWindows
    displayName: '3. Provisionar VMs Windows?'
    type: boolean
    default: true

variables:
  azureServiceConnection: 'sc-azure-subscription'
  backendResourceGroup: 'rg-terraform-br'
  backendStorageAccount: 'sttfstatev2pereira8950'
  backendContainer: 'tfstate'
  terraformVersion: '1.9.5'

stages:
  - stage: DeployResourceGroup
    displayName: '1. Deploy Resource Group'
    condition: eq('${{ parameters.deployBase }}', true)
    jobs:
      - job: RGJob
        pool:
          vmImage: 'ubuntu-24.04'
        steps:
          - checkout: self

          - bash: |
              curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
              rm -f /tmp/terraform.zip
              terraform -version
            displayName: 'Instalar Terraform CLI'

          - task: AzureCLI@2
            displayName: 'Apply Resource Group'
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(System.DefaultWorkingDirectory)/ambiente/${{ parameters.environment }}/resource_groups'
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="ac1c748c-cf7e-4d1e-82a0-d52c7062c9b2"

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=contoso-rg-${{ parameters.environment }}.tfstate"
                terraform plan -out=tfplan
                terraform apply -auto-approve tfplan

  - stage: DeployNetwork
    displayName: '2. Deploy Virtual Network'
    dependsOn: DeployResourceGroup
    condition: and(succeeded(), eq('${{ parameters.deployBase }}', true))
    jobs:
      - job: NetJob
        pool:
          vmImage: 'ubuntu-24.04'
        steps:
          - checkout: self

          - bash: |
              curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
              rm -f /tmp/terraform.zip
              terraform -version
            displayName: 'Instalar Terraform CLI'

          - task: AzureCLI@2
            displayName: 'Apply Network'
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(System.DefaultWorkingDirectory)/ambiente/${{ parameters.environment }}/network'
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="ac1c748c-cf7e-4d1e-82a0-d52c7062c9b2"

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=contoso-vnet-${{ parameters.environment }}.tfstate"
                terraform plan -out=tfplan
                terraform apply -auto-approve tfplan

  - stage: DeployLinuxVM
    displayName: '3. Deploy Linux VMs'
    dependsOn: DeployNetwork
    condition: and(in(dependencies.DeployNetwork.result, 'Succeeded', 'Skipped'), eq('${{ parameters.deployLinux }}', true))
    jobs:
      - job: LinuxVMJob
        pool:
           vmImage: 'ubuntu-24.04'
        steps:
          - checkout: self

          - bash: |
              curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
              rm -f /tmp/terraform.zip
              terraform -version
            displayName: 'Instalar Terraform CLI'

          - task: AzureCLI@2
            displayName: 'Apply Linux VM'
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(System.DefaultWorkingDirectory)/ambiente/${{ parameters.environment }}/vm_linux'
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="ac1c748c-cf7e-4d1e-82a0-d52c7062c9b2"

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=contoso-vm-linux-${{ parameters.environment }}.tfstate"
                terraform plan -out=tfplan
                terraform apply -auto-approve tfplan

  - stage: DeployWindowsVM
    displayName: '4. Deploy Windows VMs'
    dependsOn: DeployNetwork
    condition: and(in(dependencies.DeployNetwork.result, 'Succeeded', 'Skipped'), eq('${{ parameters.deployWindows }}', true))
    jobs:
      - job: WindowsVMJob
        pool:
          vmImage: 'ubuntu-24.04'
        steps:
          - checkout: self

          - bash: |
              curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
              rm -f /tmp/terraform.zip
              terraform -version
            displayName: 'Instalar Terraform CLI'

          - task: AzureCLI@2
            displayName: 'Apply Windows VM'
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(System.DefaultWorkingDirectory)/ambiente/${{ parameters.environment }}/vm_windows'
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="ac1c748c-cf7e-4d1e-82a0-d52c7062c9b2"

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=contoso-vm-windows-${{ parameters.environment }}.tfstate"
                terraform plan -out=tfplan
                terraform apply -auto-approve tfplan
